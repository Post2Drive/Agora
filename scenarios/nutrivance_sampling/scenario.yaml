events:
  - at_round: 0
    type: news
    text: Nutrivance has sent a free 7-day probiotic sampling proposal to the Lakeview Residency and Palm Grove Towers associations.
  - at_round: 2
    type: poll
    name: lakeview_approval
    question: Should the Lakeview Residency association approve Nutrivance's free 7-day sample programme for residents (no cost, no sales stall, registration with only apartment, area and flat number)?
    voters: [lakeview_secretary, lakeview_president, lakeview_treasurer]
    threshold: 0.5
  - at_round: 2
    type: poll
    name: palmgrove_approval
    question: Should the Palm Grove Towers association approve Nutrivance's free 7-day sample programme for residents (no cost, no sales stall, registration with only apartment, area and flat number)?
    voters: [palmgrove_secretary, palmgrove_president, palmgrove_treasurer]
    threshold: 0.5
  - at_round: 3
    type: post
    account: lakeview_secretary
    platform: whatsapp
    spaces: [Lakeview Residency Residents]
    when: {poll: lakeview_approval, result: yes}
    text: "Dear residents, the association has approved a FREE 7-day probiotic sample from Nutrivance (a Guntur brand). One pack per flat, no payment, no obligation. Register with only apartment name, area and flat number using the link/QR shared below. Registration closes in 2 days."
  - at_round: 3
    type: post
    account: palmgrove_secretary
    platform: whatsapp
    spaces: [Palm Grove Towers Residents]
    when: {poll: palmgrove_approval, result: yes}
    text: "Hello all, Palm Grove Towers association has approved a free 7-day probiotic sample programme by Nutrivance. Completely free, one pack per flat, no sales stall. Register with apartment, area and flat number only. Link and QR below; open for 2 days."
  - at_round: 3
    type: post
    account: nutrivance
    platform: x
    when: {any: [{poll: lakeview_approval, result: yes}, {poll: palmgrove_approval, result: yes}]}
    text: "We're starting free 7-day sampling in a few Guntur and Vijayawada communities. 20B CFU, 14 strains + inulin, once daily. No payment, no obligation. Details on our website."
  - at_round: 18
    type: news
    text: Free 7-day sample packs have been delivered to every registered flat in the participating communities.
  - at_round: 60
    type: news
    text: Most households that registered have now finished their 7-day sample packs.

conversions:
  - name: register_lakeview
    label: register your flat for the free 7-day sample (Lakeview Residency)
    open_round: 3
    close_round: 15
    when: {poll: lakeview_approval, result: yes}
    eligible_spaces: [Lakeview Residency Residents]
    base: -3.6
    stance_weight: 3.0
    exposure_weight: 0.6
    experience:
      at_round: 48
      note: You have been taking the free Nutrivance sample, one sachet a day, for about five days.
      stance_mean: 0.05     # assumption: average effect of trying it (calibrate with real feedback)
      stance_sd: 0.3
  - name: register_palmgrove
    label: register your flat for the free 7-day sample (Palm Grove Towers)
