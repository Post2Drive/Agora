    stance: {mean: 0.05, sd: 0.35}
    stubbornness: 0.3
    activity: 0.5
    platforms: [whatsapp, x, reddit]
    occupations: [IT analyst, chartered accountant, startup employee, pharmacist, MBA student]
    age: [23, 34]
    names: [Sai, Teja, Rohit, Anjali, Chaitanya, Varsha, Ajay, Nithya, Manoj, Haritha]
  - name: budget_homemakers
    share: 0.25
    persona: Homemaker who manages the household budget, active in the apartment WhatsApp group, likes free trials but asks "what's the catch".
    stance: {mean: 0.0, sd: 0.3}
    stubbornness: 0.45
    activity: 0.5
    influence: 1.2
    platforms: [whatsapp]
    occupations: [homemaker, part-time tutor, home baker]
    age: [30, 55]
    names: [Madhavi, Sowjanya, Gayathri, Pooja, Meera, Kavya, Sneha, Deepika]

