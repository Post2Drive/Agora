# Demo: free 7-day probiotic sampling in residential apartment communities.
#
# Question: will apartment committees approve it, how many flats register, what do
# residents say in their WhatsApp groups, and how many go on to buy?
#
# Community names are fictional. All adoption numbers below are starting
# assumptions; Phase 4 calibrates them against real campaign results.

name: nutrivance-residential-sampling
topic: the free 7-day Nutrivance probiotic sample offered to your apartment
question: >
  Will apartment committees approve a free 7-day probiotic sampling programme, how
  many households register, how do residents talk about it, and how many buy afterwards?
context: |
  Nutrivance Precision Probiotics (NPP) is a new probiotic brand from Guntur, Andhra Pradesh.
  It is a daily sachet: 20 billion CFU, 14 probiotic strains, 100 mg inulin (prebiotic),
  taken once a day as per the label. MRP is Rs 69 per sachet (Rs 483 for seven).
  NPP has proposed a free sampling programme to premium apartment communities:
  every registered flat gets one free 7-day pack (7 sachets). No payment, no purchase
  obligation, no sales stall. The apartment association must approve it first.
  Registration is an online form asking only apartment name, area and flat number
  (no name, phone or email), open for 2-3 days. One pack per flat.
  The product website has formulation details and purchase information.
  NPP makes no medical, disease-treatment or prevention claims.

seed: 42
start: "2026-11-16T08:00:00"
rounds: 72            # 12 simulated days
round_hours: 4
feed_size: 8
memory_size: 10
avg_follows: 15
homophily: 0.6

population:
  llm_agents: 40      # residents who think and write with the local model
  crowd_agents: 1500  # residents driven by opinion maths (like, forward, register, buy)

llm:
  backend: ollama
  model: llama3.2:3b
  url: http://localhost:11434
  parallel: 1

segments:
  - name: health_conscious_parents
    share: 0.25
    persona: Parent in a premium Guntur/Vijayawada apartment who reads labels and cares about family nutrition.
    stance: {mean: 0.15, sd: 0.3}
    stubbornness: 0.35
    activity: 0.45
    platforms: [whatsapp, x]
    occupations: [software engineer, doctor, teacher, bank manager, business owner]
    age: [28, 45]
    names: [Priya, Sravani, Karthik, Divya, Harsha, Keerthi, Naveen, Bhavana, Vamsi, Swathi]
  - name: senior_residents
    share: 0.20
    persona: Retired resident, cautious about new supplements, trusts the family doctor and long-time neighbours.
    stance: {mean: -0.1, sd: 0.3}
    stubbornness: 0.6
    activity: 0.35
    influence: 1.3
    openness: 0.5
    platforms: [whatsapp]
    occupations: [retired government officer, retired teacher, retired engineer, landlord]
    age: [60, 78]
    names: [Venkata Rao, Lakshmi, Subba Rao, Padmavathi, Srinivas, Saraswathi, Ramesh, Kamala]
  - name: young_professionals
