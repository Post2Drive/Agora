# Demo: a fictional city mayoral election with three candidates.
# All names, places and numbers are invented. Leanings are starting assumptions;
# calibrate with real polls (agora calibrate) before trusting the result.

name: riverton-mayor-election
topic: the Riverton mayoral election
question: >
  Who will win the Riverton mayoral election, by how much, and which groups decide it?
context: |
  Riverton is a mid-sized city choosing a new mayor. Three candidates are running:
  Asha Rao (Civic Renewal) promises better buses and cheaper housing, funded by a small
  property-tax rise. Daniel Okafor (Riverton First) promises to cut property tax and
  speed up business permits. Meera Pillai (independent) is a retired judge running on
  anti-corruption and cleaner city services. Polls open on the last two days.

seed: 7
start: "2026-12-01T08:00:00"
minutes_per_round: 180          # 3-hour rounds
rounds: 80                      # 10 days
feed_size: 8
memory_size: 10

