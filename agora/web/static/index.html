<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agora</title>
<style>
:root{
  --bg:#f7f6f2;--surface:#ffffff;--sunk:#efede7;--fg:#1c1b18;--muted:#6d6a62;--line:#e1ded6;
  --accent:#2f5d50;--accent-fg:#ffffff;--accent-soft:#e3ece8;--warn:#a25b12;--bad:#a83232;--good:#2f7a4a;
  --radius:12px;--shadow:0 1px 2px rgba(0,0,0,.04),0 4px 16px rgba(0,0,0,.04);
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#141412;--surface:#1c1c19;--sunk:#24241f;--fg:#ecebe5;--muted:#9d9a90;--line:#33322c;
  --accent:#7fb8a6;--accent-fg:#10201b;--accent-soft:#22332e;--warn:#e0a35c;--bad:#e07a7a;--good:#7fc79a;
  --shadow:none}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:20px;padding:12px 24px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.brand{font-weight:700;font-size:18px;letter-spacing:-.01em;text-decoration:none;display:flex;align-items:center;gap:8px}
.brand i{width:22px;height:22px;border-radius:7px;background:var(--accent);display:inline-block;position:relative}
.brand i:after{content:"";position:absolute;inset:6px;border-radius:50%;border:2px solid var(--accent-fg)}
header nav{display:flex;gap:4px;flex:1}
header nav a{text-decoration:none;padding:6px 12px;border-radius:8px;color:var(--muted)}
header nav a.on,header nav a:hover{background:var(--sunk);color:var(--fg)}
.pill{font-size:12px;padding:3px 10px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.ok{background:color-mix(in srgb,var(--good) 15%,transparent);color:var(--good)}
.pill.bad{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
.pill.run{background:var(--accent-soft);color:var(--accent)}
main{max-width:1200px;margin:0 auto;padding:28px 24px 80px}
h1{font-size:28px;letter-spacing:-.02em;margin:0 0 6px}
h2{font-size:18px;margin:0 0 12px}
h3{font-size:15px;margin:0 0 8px}
.muted{color:var(--muted)}.small{font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.g3{grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:9px;cursor:pointer;text-decoration:none;display:inline-flex;gap:6px;align-items:center}
.btn:hover{background:var(--sunk)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}
label{display:block;font-weight:600;font-size:13px;margin:14px 0 6px}
input[type=text],input[type=number],input[type=url],select,textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--surface)}
textarea{min-height:110px;resize:vertical}
textarea.code{font:13px/1.5 var(--mono);min-height:460px;white-space:pre;tab-size:2}
.check{display:flex;gap:8px;align-items:center;font-weight:400;font-size:14px;margin:8px 0}
.drop{border:1.5px dashed var(--line);border-radius:var(--radius);padding:26px;text-align:center;cursor:pointer;background:var(--sunk)}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.files{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.file{font-size:13px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:4px 8px;display:flex;gap:6px;align-items:center}
.file button{border:0;background:none;cursor:pointer;color:var(--muted);padding:0}
.steps{display:flex;gap:6px;margin:18px 0 22px;flex-wrap:wrap}
.step{display:flex;gap:8px;align-items:center;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);text-decoration:none;font-size:14px;color:var(--muted)}
.step b{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--sunk);font-size:12px;color:var(--fg)}
.step.done b{background:var(--accent);color:var(--accent-fg)}
.step.on{border-color:var(--accent);color:var(--fg);box-shadow:0 0 0 2px var(--accent-soft)}
.log{font:12.5px/1.55 var(--mono);background:var(--sunk);border-radius:10px;padding:14px;max-height:420px;overflow:auto;white-space:pre-wrap}
.bar{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:2px 8px;border-radius:999px;background:var(--sunk);margin:2px 3px 2px 0;white-space:nowrap}
.badge i{width:8px;height:8px;border-radius:50%}
.stance{display:inline-block;width:70px;height:6px;border-radius:9px;background:linear-gradient(90deg,var(--bad),var(--sunk),var(--good));position:relative;vertical-align:middle}
.stance:after{content:"";position:absolute;top:-3px;width:3px;height:12px;border-radius:2px;background:var(--fg);left:var(--x)}
.feed{display:flex;flex-direction:column;gap:10px;max-height:78vh;overflow:auto;padding-right:4px}
.post{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--surface)}
.post .meta{font-size:12px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:4px}
.post .who{font-weight:600;color:var(--fg);font-size:14px}
.post .txt{white-space:pre-wrap;word-break:break-word}
.post .counts{font-size:12px;color:var(--muted);margin-top:6px;display:flex;gap:12px}
.post.reply{margin-left:22px;border-left:3px solid var(--line)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 11px;font-size:13px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip i{width:8px;height:8px;border-radius:50%}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.kpi{background:var(--sunk);border-radius:10px;padding:12px}
.kpi b{display:block;font-size:22px;letter-spacing:-.02em}
.kpi span{font-size:12px;color:var(--muted)}
.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:10px;height:3px;border-radius:2px;margin-right:5px;vertical-align:middle}
.timeline{border-left:2px solid var(--line);margin-left:6px;padding-left:16px}
.tl{position:relative;padding:4px 0 10px}
.tl:before{content:"";position:absolute;left:-22px;top:10px;width:10px;height:10px;border-radius:50%;background:var(--accent)}
.empty{text-align:center;padding:60px 20px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:20;max-width:90vw}
iframe{width:100%;height:76vh;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface)}
details>summary{cursor:pointer;font-weight:600}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:16px;align-items:start}
@media (max-width:900px){.split{grid-template-columns:1fr}header{padding:10px 16px}main{padding:20px 16px 60px}header nav{display:none}}
</style>
</head>
<body>
<header>
  <a class="brand" href="#/"><i></i>Agora</a>
  <nav><a href="#/" data-nav="home">Home</a><a href="#/settings" data-nav="settings">Settings</a></nav>
  <span class="pill" id="hw" title="This machine"></span>
</header>
<main id="view"></main>
<script>
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const PCOL={x:'#5b5b5b',threads:'#7a7a7a',instagram:'#d6249f',facebook:'#1877f2',linkedin:'#0a66c2',youtube:'#e62117',tiktok:'#19b3b1',reddit:'#ff4500',facebook_groups:'#4a7fd4',whatsapp:'#25a85a',telegram:'#229ed9'};
const SCOL=['#2f6f8f','#c46b2d','#7a5aa6','#3d8b5a','#b8456b','#8a7a2e','#3f7fbf','#a0522d'];
let INFO=null, timer=null, state={};
async function api(path,opts={}){const o={...opts,headers:{'X-Agora':'1',...(opts.body?{'Content-Type':'application/json'}:{})}};
  if(o.body&&typeof o.body!=='string')o.body=JSON.stringify(o.body);
  const r=await fetch('/api/'+path,o);const j=await r.json().catch(()=>({error:r.statusText}));if(!r.ok)throw new Error(j.error||r.statusText);return j}
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),3500)}
const plabel=k=>(INFO?.platforms.find(p=>p.key===k)||{label:k}).label;
const pbadge=k=>`<span class="badge"><i style="background:${PCOL[k]||'#888'}"></i>${esc(plabel(k))}</span>`;
const stance=x=>`<span class="stance" style="--x:${((+x+1)/2*100).toFixed(0)}%" title="${(+x).toFixed(2)}"></span>`;
const fmtDur=s=>s<90?`${Math.round(s)} s`:s<5400?`${Math.round(s/60)} min`:`${(s/3600).toFixed(1)} h`;
function nav(){const st=location.hash.startsWith('#/settings');document.querySelectorAll('[data-nav]').forEach(a=>a.classList.toggle('on',st?a.dataset.nav==='settings':a.dataset.nav==='home'))}

/* ------------------------------------------------------------ router */
async function route(){clearInterval(timer);timer=null;nav();const h=location.hash.slice(2).split('/');
  try{if(h[0]==='new'){location.hash='#/';return}
  if(h[0]==='settings')return settings();if(h[0]==='compare')return comparePage(h[1]||'');if(h[0]==='p'&&h[1])return project(decodeURIComponent(h[1]),h[2]||'');return home()}
  catch(e){$('#view').innerHTML=`<div class="card"><h2>Something went wrong</h2><p class="muted">${esc(e.message)}</p><a class="btn" href="#/">Home</a></div>`}}
window.addEventListener('hashchange',route);

/* ------------------------------------------------------------ home */
async function home(){const ps=await api('projects');
  const card=p=>{const r=p.run,j=p.job;let st='<span class="pill">Setup ready</span>';
    if(j&&j.state==='running')st=`<span class="pill run">${j.kind==='create'?'Building…':'Simulating…'}</span>`;
    else if(j&&j.state==='error')st='<span class="pill bad">Needs attention</span>';
    else if(r.started&&r.rounds_done>=r.rounds_total)st='<span class="pill ok">Complete</span>';
    else if(r.started)st=`<span class="pill">${r.rounds_done}/${r.rounds_total} rounds</span>`;
    else if(!p.has_scenario)st='<span class="pill">Not set up</span>';
    return `<a class="card" style="text-decoration:none;display:block" href="#/p/${p.id}/"><div class="row"><h3 style="margin:0">${esc(p.title)}</h3><span class="spacer"></span>${st}</div>
      <p class="muted small" style="margin:8px 0 0">${esc(p.prompt||'')}</p></a>`};
  await newStudy(true);
  if(ps.length)$('#view').insertAdjacentHTML('beforeend',`<div class="row" style="margin:34px 0 12px"><h2 style="margin:0">Your studies</h2><span class="spacer"></span>${ps.filter(p=>p.run.started).length>1?'<a class="btn" href="#/compare">Compare studies</a>':''}</div><div class="grid g3">${ps.map(card).join('')}</div>`);
  if(ps.some(p=>p.job&&p.job.state==='running'))timer=setInterval(()=>{if((location.hash===''||location.hash==='#/')&&!document.activeElement?.matches('input,textarea'))home()},4000)}

/* ------------------------------------------------------------ new study */
const ACCEPT='.pdf,.docx,.txt,.md,.markdown,.csv,.tsv,.json,.html,.htm';
async function newStudy(isHome){const files=[];const d=INFO.llm_default;
  $('#view').innerHTML=`<div style="text-align:center;margin:10px 0 6px"><h1 style="font-size:2rem;margin-bottom:6px">Predict how people will react</h1><p class="muted" style="margin:0">Upload your documents, describe what you want to predict, and Agora builds a world of AI people who read, talk and act on it.</p></div>
  <div class="grid g2" style="margin-top:18px"><div class="card">
    <label for="name">Name</label><input type="text" id="name" placeholder="e.g. Product launch in Hyderabad">
    <label for="prompt">What do you want to predict?</label>
    <textarea id="prompt" placeholder="e.g. How will people react to this launch, what will they say online, and how many will buy in the first month?"></textarea>
    <label>Documents</label><div class="drop" id="drop"><b>Drop files here</b> or click to choose<br><span class="muted small">PDF, Word, text, Markdown, CSV, JSON, web pages</span></div>
    <input type="file" id="fi" multiple accept="${ACCEPT}" hidden><div class="files" id="fl"></div></div>
  <div class="card"><h2>Models</h2><p class="muted small" style="margin-top:-6px">Local runs on this laptop and nothing leaves it. Claude or ChatGPT send that step's text to the provider and need an API key (<a href="#/settings">Settings</a>).</p>
    ${picker('b','Graph, people and report','Builds the knowledge graph, creates every person and writes the report.')}
    ${picker('s','Simulation','Every AI person\'s thinking, round by round. The most calls by far.')}
    <details style="margin-top:18px"><summary>More options</summary>
      <label class="check"><input type="checkbox" id="fast"> Build the graph without the model (faster, rougher)</label>
      <label class="check"><input type="checkbox" id="personas" checked> Write an individual background for every AI resident</label>
      <label for="hours">Time budget for the simulation (hours on this machine)</label><input type="number" id="hours" value="12" min="1" max="200">
      <div class="grid" style="grid-template-columns:1fr 1fr;gap:10px"><div><label for="voices">AI voices</label><input type="number" id="voices" placeholder="auto"></div><div><label for="crowd">Crowd agents</label><input type="number" id="crowd" placeholder="auto"></div></div>
    </details></div></div>
  <div class="row" style="margin-top:18px"><span class="spacer"></span><button class="btn primary" id="go">Start: build the graph</button></div>`;
  const fl=()=>{$('#fl').innerHTML=files.map((f,i)=>`<span class="file">${esc(f.name)} <span class="muted">${(f.size/1024).toFixed(0)} KB</span><button data-i="${i}" title="Remove">✕</button></span>`).join('');
    $('#fl').querySelectorAll('button').forEach(b=>b.onclick=()=>{files.splice(+b.dataset.i,1);fl()})};
  const add=list=>{for(const f of list)files.push(f);fl()};
  $('#drop').onclick=()=>$('#fi').click();$('#fi').onchange=e=>add(e.target.files);
  ['dragenter','dragover'].forEach(ev=>$('#drop').addEventListener(ev,e=>{e.preventDefault();$('#drop').classList.add('over')}));
  ['dragleave','drop'].forEach(ev=>$('#drop').addEventListener(ev,e=>{e.preventDefault();$('#drop').classList.remove('over')}));
  $('#drop').addEventListener('drop',e=>add(e.dataTransfer.files));
  wirePicker('b',d);wirePicker('s',d);
  $('#go').onclick=async()=>{const prompt=$('#prompt').value.trim();if(!prompt)return toast('Describe what you want to predict.');if(!files.length)return toast('Add at least one document.');
    $('#go').disabled=true;$('#go').textContent='Uploading…';
    try{const enc=await Promise.all(files.map(f=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res({name:f.name,data:String(r.result).split(',')[1]||''});r.onerror=rej;r.readAsDataURL(f)})));
      const sv=pick('s'),bv=pick('b');
      const body={name:$('#name').value.trim()||prompt.slice(0,40),prompt,files:enc,options:{mock:false,backend:sv.backend,model:sv.model,url:sv.url,build_backend:bv.backend,build_model:bv.model,build_url:bv.url,fast:$('#fast').checked,personas:$('#personas').checked,hours:+$('#hours').value||12,llm_agents:+$('#voices').value||null,crowd:+$('#crowd').value||null}};
      const r=await api('projects',{method:'POST',body});location.hash=`#/p/${r.id}/build`}
    catch(e){toast(e.message);$('#go').disabled=false;$('#go').textContent='Start: build the graph'}}}


/* model picker: local Ollama, another local server, Claude or ChatGPT */
const PROV={ollama:'Local — Ollama (this laptop)',openai:'Local — other server (llama.cpp, LM Studio, vLLM)',claude:'Claude (Anthropic API)',chatgpt:'ChatGPT (OpenAI API)'};
function picker(k,title,desc){return `<div style="border-top:1px solid var(--line);margin-top:14px;padding-top:10px"><b>${title}</b><div class="muted small">${desc}</div>
  <select id="${k}be">${Object.entries(PROV).map(([v,l])=>`<option value="${v}">${l}</option>`).join('')}</select>
  <label for="${k}mo">Model</label><input type="text" id="${k}mo" list="${k}ml"><datalist id="${k}ml"></datalist>
  <div id="${k}urow"><label for="${k}ur">Server address</label><input type="url" id="${k}ur"></div>
  <div class="row" style="margin-top:8px"><button class="btn" id="${k}ck">Check</button><span id="${k}st" class="small muted"></span></div></div>`}
async function wirePicker(k,d){let keys={};try{keys=await api('settings/keys')}catch(e){}
  const be=$('#'+k+'be'),mo=$('#'+k+'mo'),ur=$('#'+k+'ur');
  const set=()=>{const v=be.value,cloud=v==='claude'||v==='chatgpt';$('#'+k+'urow').style.display=cloud?'none':'';
    $('#'+k+'ml').innerHTML=cloud?(keys[v]?.models||[]).map(m=>`<option value="${m}">`).join(''):'';
    mo.value=cloud?(keys[v]?.model||''):d.model;ur.value=v==='openai'?'http://localhost:8080':d.url;
    $('#'+k+'st').innerHTML=cloud&&!keys[v]?.set?`<span class="pill bad">No API key yet</span> <a href="#/settings">Add in Settings</a>`:''};
  be.onchange=set;set();
  $('#'+k+'ck').onclick=async()=>{$('#'+k+'st').textContent='Checking…';const r=await api(`llm/status?backend=${encodeURIComponent(be.value)}&model=${encodeURIComponent(mo.value)}&url=${encodeURIComponent(ur.value)}`);$('#'+k+'st').innerHTML=`<span class="pill ${r.ok?'ok':'bad'}">${esc(r.message)}</span>`}}
function pick(k){const v=$('#'+k+'be').value;return {backend:v,model:$('#'+k+'mo').value.trim(),url:(v==='claude'||v==='chatgpt')?'':$('#'+k+'ur').value}}

/* settings: API keys stay on this computer */
async function settings(){const k=await api('settings/keys');
  $('#view').innerHTML=`<h1>Settings</h1><p class="muted">Optional cloud models. Keys are saved only on this computer (in your user folder), never in study files. Using a cloud model sends that step's text to the provider and is billed by them.</p>
  <div class="grid g2">${Object.entries(k).map(([p,x])=>`<div class="card"><h2>${esc(x.label)}</h2>
    <p class="small">${x.set?`<span class="pill ok">Key saved</span> <span class="muted">${esc(x.hint)}${x.from_env?' (from environment)':''}</span>`:'<span class="pill">No key</span>'}</p>
    <label for="k_${p}">API key</label><input type="password" id="k_${p}" placeholder="Paste your key" autocomplete="off">
    <p class="muted small">Get one at <a href="${x.keys_url}" target="_blank" rel="noopener">${x.keys_url.replace('https://','')}</a>. Default model: ${esc(x.model)}.</p>
    <div class="row"><button class="btn primary" data-save="${p}">Save</button>${x.set?`<button class="btn danger" data-del="${p}">Remove</button>`:''}</div></div>`).join('')}</div>`;
  $('#view').querySelectorAll('[data-save]').forEach(b=>b.onclick=async()=>{const p=b.dataset.save,v=$('#k_'+p).value.trim();if(!v)return toast('Paste a key first.');await api('settings/keys',{method:'PUT',body:{provider:p,key:v}});toast('Saved');settings()});
  $('#view').querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{await api('settings/keys',{method:'PUT',body:{provider:b.dataset.del,key:''}});settings()})}

/* ------------------------------------------------------------ project */
const TABS=[['graph','Graph Build'],['setup','Environment Setup'],['sim','Simulation'],['report','Report'],['people','Deep Interaction']];
async function project(id,tab){const p=await api('projects/'+encodeURIComponent(id));state.p=p;
  if(tab==='build')tab='graph';if(!tab){tab=p.has_report?'report':p.run.started?'sim':p.has_scenario&&!(p.job&&p.job.kind==='create'&&p.job.state==='running')?'setup':'graph';history.replaceState(null,'',`#/p/${id}/${tab}`)}
  const building=p.job&&p.job.kind==='create'&&p.job.state==='running';const done={graph:p.has_graph&&!building,setup:p.has_scenario,sim:p.run.started&&p.run.rounds_done>=p.run.rounds_total,report:p.has_report,people:false,data:false};
  $('#view').innerHTML=`<div class="row"><div style="min-width:0"><a href="#/" class="muted small" style="text-decoration:none">← Home</a><h1 style="margin-top:4px">${esc(p.title)}</h1><p class="muted" style="margin:0;max-width:820px">${esc(p.prompt)}</p></div><span class="spacer"></span><button class="btn danger" id="del">Delete</button></div>
    <div class="steps">${TABS.map(([k,l],i)=>`<a class="step ${k===tab?'on':''} ${done[k]?'done':''}" href="#/p/${id}/${k}"><b>${done[k]?'✓':String(i+1).padStart(2,'0')}</b>${l}</a>`).join('')}</div><div id="tab"></div>`;

/* ------------------------------------------------------------ simulation */
function lineChart(series,{ymin,ymax,xmax,ylab,fmt}){const W=640,H=230,L=44,R=10,T=10,B=26,w=W-L-R,h=H-T-B;
  const X=x=>L+(xmax?x/xmax:0)*w, Y=y=>T+h-(y-ymin)/(ymax-ymin||1)*h;let g='';
  const ticks=5;for(let i=0;i<=ticks;i++){const v=ymin+(ymax-ymin)*i/ticks,y=Y(v);g+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${L-6}" y="${y+4}" font-size="11" text-anchor="end" fill="var(--muted)">${fmt?fmt(v):v.toFixed(1)}</text>`}
  for(let i=0;i<=4;i++){const x=xmax*i/4;g+=`<text x="${X(x)}" y="${H-6}" font-size="11" text-anchor="middle" fill="var(--muted)">${Math.round(x)}</text>`}
  series.forEach(s=>{if(!s.points.length)return;g+=`<polyline fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" points="${s.points.map(([x,y])=>`${X(x).toFixed(1)},${Y(y).toFixed(1)}`).join(' ')}"/>`});
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(ylab)}">${g}</svg><div class="legend">${series.map(s=>`<span><i style="background:${s.color}"></i>${esc(s.name)}</span>`).join('')}</div>`}

function tabSim(p){if(!p.scenario){$('#tab').innerHTML='<div class="card">Set up the study first.</div>';return}

function injectCard(p){const s=p.scenario;return `<div class="card"><h3>Add an event</h3><p class="muted small" style="margin-top:-4px">Happens at the next round, as if it were in the plan. Try "a doctor says…" or a new offer.</p>

  <div class="row small" id="ishift" style="margin-top:6px">Assumed effect on everyone who hears it:
    ${(s.choice?s.choice.options:['stance']).map(o=>`<label class="row" style="gap:4px;font-weight:400">${esc(o==='stance'?'opinion':o)} <input type="number" step="0.05" min="-1" max="1" value="0" data-o="${esc(o)}" style="width:76px"></label>`).join('')}</div>

async function bindInject(p){const s=p.scenario;if(!$('#ity'))return;

function drawSim(p,l){if(!$('#ctl'))return;const r=l.run,j=p.job,running=j&&j.kind==='run'&&j.state==='running',pct=r.rounds_total?r.rounds_done/r.rounds_total*100:0,complete=r.rounds_done>=r.rounds_total;

  // charts

  const cmax=Math.max(5,...Object.values(tot));const population=Object.values(l.conversion_base||{}).reduce((a,b)=>a+b,0);

  $('#left').innerHTML=chHtml+`<div class="card"><div class="kpis">${names.map(n=>`<div class="kpi"><b>${(tot[n]||0).toLocaleString()}</b><span>${esc(n.replace(/_/g,' '))}${population?` · ${((tot[n]||0)/population*100).toFixed(1)}%`:''}</span></div>`).join('')}<div class="kpi"><b>${posts.toLocaleString()}</b><span>posts and messages</span></div></div></div>
    <div class="card chart"><h3>Opinion by group <span class="muted small">(−1 against … +1 for)</span></h3>${lineChart(op,{ymin:-1,ymax:1,xmax:maxR,ylab:'Opinion'})}</div>

    <div class="card"><h3>Decisions and events</h3>${l.polls.map(x=>`<p style="margin:4px 0"><span class="pill ${x.passed?'ok':'bad'}">${x.passed?'Approved':'Rejected'}</span> ${esc(x.name.replace(/_/g,' '))} <span class="muted small">${x.yes} yes / ${x.no} no</span></p>`).join('')||'<p class="muted small">No decisions yet.</p>'}
      <div class="timeline" style="margin-top:10px">${l.events.filter(e=>e.kind!=='poll').slice(-8).map(e=>`<div class="tl small"><span class="muted">Round ${e.round+1}</span> · ${e.kind==='news'?esc(e.detail.text):e.kind==='post'?`@${esc(e.detail.account)} posted on ${esc(plabel(e.detail.platform))}`:e.kind==='experience'?`${e.detail.agents} people tried it (${esc(e.detail.conversion.replace(/_/g,' '))})`:e.kind==='skipped'?'A planned step was skipped (its decision was not approved)':esc(e.kind)}</div>`).join('')}</div></div>`;
  // feed filters
  const plats=Object.keys(l.platforms);const f=state.filter;
  $('#pf').innerHTML=[['','All']].concat(plats.map(k=>[k,plabel(k)])).map(([k,lab])=>`<span class="chip ${f.platform===k?'on':''}" data-k="${k}">${k?`<i style="background:${PCOL[k]||'#888'}"></i>`:''}${esc(lab)}${k?` <span class="muted">${l.platforms[k]}</span>`:''}</span>`).join('');
  $('#pf').querySelectorAll('.chip').forEach(c=>c.onclick=()=>{f.platform=c.dataset.k;f.space='';clearInterval(timer);tabSim(p)});

  $('#sp').style.display=spaces.length?'':'none';$('#sp').onchange=e=>{f.space=e.target.value;clearInterval(timer);tabSim(p)};
  const feed=$('#feed');const atTop=feed.scrollTop<40;

const pctf=v=>(v*100).toFixed(1)+'%';
async function tabData(p){const s=p.scenario;if(!s){$('#tab').innerHTML='<div class="card">Set up the study first.</div>';return}
  const st=await api(`projects/${p.id}/calibration`);const j=p.job&&['calibrate','backtest','forecast'].includes(p.job.kind)?p.job:null,running=j&&j.state==='running';
  const metrics=[...s.conversions.map(c=>c.name),...(s.choice?s.choice.options:[]),...(s.choice?['turnout']:[]),'opinion'];
  const tmpl='day,'+metrics.slice(0,5).join(',')+'\n1,'+metrics.slice(0,5).map(()=>'').join(',')+'\n';
  $('#tab').innerHTML=`<div class="grid g2"><div class="card"><h2>Real data</h2><p class="muted small" style="margin-top:-6px">What actually happened. Agora adjusts its assumptions until the simulation matches, then tests itself and gives ranges.</p>
      <h3>What happened (observations.csv) ${st.files.observations?'<span class="pill ok">added</span>':''}</h3>
      <p class="small muted">One row per day; columns are things you counted: ${metrics.map(m=>`<code>${esc(m)}</code>`).join(', ')}. Counts are running totals; shares and turnout can be % (e.g. a poll). Day 1 = first simulated day, or use a <code>date</code> column.</p>
      <textarea id="obs" class="code" style="min-height:120px" placeholder="${esc(tmpl)}"></textarea>
      <div class="row" style="margin-top:6px"><input type="file" id="obsf" accept=".csv,.tsv,.txt"><span class="spacer"></span><button class="btn" id="obsgo">Save</button></div>
      <h3 style="margin-top:16px">Reviews or ratings (reviews.csv, optional) ${st.files.reviews?'<span class="pill ok">added</span>':''}</h3>
      <p class="small muted">Columns <code>text</code>, <code>rating</code> (1-5) and optional <code>segment</code>. Used to set starting opinions.</p>
      <textarea id="rev" class="code" style="min-height:80px" placeholder="text,rating,segment"></textarea>
      <div class="row" style="margin-top:6px"><input type="file" id="revf" accept=".csv,.tsv,.txt"><span class="spacer"></span><button class="btn" id="revgo">Save</button></div><p id="dmsg" class="small"></p></div>
    <div class="card"><h2>Fit, test, forecast</h2>
      <p class="small muted">These use fast runs (the AI voices are replaced by rule-based stand-ins), so they take minutes, not hours.</p>
      <div class="row"><button class="btn primary" id="cal" ${running?'disabled':''}>Calibrate</button><button class="btn" id="bt" ${running?'disabled':''}>Backtest</button>
        <span class="spacer"></span><label class="small">Runs <input type="number" id="runs" value="30" min="5" max="200" style="width:70px"></label><button class="btn" id="fc" ${running?'disabled':''}>Forecast ranges</button></div>
      ${j?`<div class="log" style="margin-top:12px" id="jlog">${esc(j.log.slice(-20).join('\n'))}</div>${running?'<button class="btn" id="jstop" style="margin-top:8px">Stop</button>':''}${j.error?`<p class="pill bad">${esc(j.error)}</p>`:''}`:''}
      <div id="calres"></div></div></div><div id="fcres"></div>`;
  const load=(fi,ta)=>{$(fi).onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{$(ta).value=r.result};r.readAsText(f)}};load('#obsf','#obs');load('#revf','#rev');
  const save=kind=>async()=>{const text=$(kind==='observations'?'#obs':'#rev').value;try{const r=await api(`projects/${p.id}/data`,{method:'POST',body:{kind,text}});$('#dmsg').innerHTML=`<span class="pill ok">Saved: ${esc(JSON.stringify(r))}</span>`;setTimeout(route,800)}catch(e){$('#dmsg').innerHTML=`<span class="pill bad">${esc(e.message)}</span>`}};
  $('#obsgo').onclick=save('observations');$('#revgo').onclick=save('reviews');
  const start=(what,body={})=>async()=>{try{await api(`projects/${p.id}/${what}`,{method:'POST',body});route()}catch(e){toast(e.message)}};
  $('#cal').onclick=start('calibrate');$('#bt').onclick=start('backtest');$('#fc').onclick=()=>start('forecast',{runs:+$('#runs').value||30})();
  if($('#jstop'))$('#jstop').onclick=()=>api(`projects/${p.id}/stop`,{method:'POST'});
  if(running)timer=setInterval(async()=>{const q=await api('projects/'+p.id);if(!q.job||q.job.state!=='running'){clearInterval(timer);route()}else if($('#jlog'))$('#jlog').textContent=q.job.log.slice(-20).join('\n')},1500);
  let h='';const c=st.calibration;
  if(c){h+=`<h3 style="margin-top:16px">Calibration ${st.applied?'<span class="pill ok">applied</span>':''}</h3><table><thead><tr><th>Assumption</th><th>Before</th><th>Fitted</th></tr></thead><tbody>${c.changes.map(x=>`<tr><td>${esc(x.what)}</td><td>${esc(x.from)}</td><td><b>${esc(x.to)}</b></td></tr>`).join('')}</tbody></table>
    ${c.fit&&c.fit.score?`<table><thead><tr><th>Fit</th><th>Average error</th><th>Points</th></tr></thead><tbody>${Object.entries(c.fit.score).map(([k,v])=>`<tr><td>${esc(k)}</td><td>${v.mae}${v.mape!=null?` (${(v.mape*100).toFixed(1)}%)`:''}</td><td>${v.points}</td></tr>`).join('')}</tbody></table>`:''}
    ${st.applied?'':`<div class="row" style="margin-top:8px"><span class="small muted">${p.run.started?'This study has been run: fork it, then apply to the fork.':'Apply writes the fitted numbers into the setup (a backup is kept).'}</span><span class="spacer"></span>${p.run.started?'':'<button class="btn primary" id="apply">Apply</button>'}</div>`}`}
  const b=st.backtest;if(b){h+=`<h3 style="margin-top:16px">Backtest <span class="muted small">fitted on days ≤ ${b.cutoff_day}, predicting ${b.test_points} later points</span></h3><table><thead><tr><th>Metric</th><th>Simulation error</th><th>Statistical baseline</th><th>Better</th></tr></thead><tbody>
    ${Object.entries(b.simulation.score).map(([k,v])=>`<tr><td>${esc(k)}</td><td>${v.mae}</td><td>${b.baseline.score[k]?b.baseline.score[k].mae:'—'}</td><td>${esc(b.better[k]||'')}</td></tr>`).join('')}</tbody></table>`}
  $('#calres').innerHTML=h;if($('#apply'))$('#apply').onclick=async()=>{try{await api(`projects/${p.id}/calibration/apply`,{method:'POST'});toast('Applied.');route()}catch(e){toast(e.message)}};
  const f=st.forecast;if(f){const mc=f.monte_carlo;const fmtv=(k,v)=>k.startsWith('share:')||k==='turnout'||k==='in_favour'?pctf(v):k.startsWith('action:')?Math.round(v).toLocaleString():(v>=0?'+':'')+v.toFixed(2);
    const bandKeys=Object.keys(mc.bands||{});
    $('#fcres').innerHTML=`<div class="card" style="margin-top:16px"><h2>Forecast <span class="muted small">${mc.runs} runs${f.calibrated?' · calibrated':' · not calibrated yet'} · ${esc(f.generated)}</span></h2>
      <div class="grid g2"><div><table><thead><tr><th>Outcome</th><th>Low (10%)</th><th>Middle</th><th>High (90%)</th></tr></thead><tbody>${Object.entries(mc.summary).map(([k,v])=>`<tr><td>${esc(k.split(':').pop().replace(/_/g,' '))}</td><td>${fmtv(k,v.p10)}</td><td><b>${fmtv(k,v.p50)}</b></td><td>${fmtv(k,v.p90)}</td></tr>`).join('')}</tbody></table>
        ${Object.keys(mc.win_probability||{}).length?`<h3>Chance of winning</h3><div class="kpis">${Object.entries(mc.win_probability).sort((a,b)=>b[1]-a[1]).map(([o,w])=>`<div class="kpi"><b>${Math.round(w*100)}%</b><span>${esc(o)}</span></div>`).join('')}</div>`:''}
        ${Object.keys(mc.targets||{}).length?`<h3>Targets</h3>${Object.entries(mc.targets).map(([n,t])=>`<p>${esc(n.replace(/_/g,' '))} ≥ ${t.goal}: <b>${Math.round(t.probability*100)}%</b> chance</p>`).join('')}`:''}</div>
      <div>${bandKeys.length?`<select id="bk" style="width:auto">${bandKeys.map(k=>`<option>${esc(k)}</option>`).join('')}</select><div id="band" class="chart"></div>`:''}</div></div>
      ${f.sensitivity?`<h3 style="margin-top:16px">What moves ${esc(f.sensitivity.outcome.split(':').pop())} most</h3>${f.sensitivity.levers.slice(0,10).map(r=>{const mx=f.sensitivity.levers[0].swing||1;return `<div style="margin:6px 0"><div class="row small"><span>${esc(r.lever)}</span><span class="spacer"></span><span class="muted">${fmtv(f.sensitivity.outcome,r.low)} → ${fmtv(f.sensitivity.outcome,r.high)}</span></div><div class="bar"><i style="width:${(r.swing/mx*100).toFixed(1)}%"></i></div></div>`}).join('')}`:''}</div>`;
    const drawBand=()=>{const k=$('#bk').value,bd=mc.bands[k];const n=bd.p50.length;const pts=a=>a.map((v,i)=>[i+1,v]);const mx=Math.max(...bd.p90,k.startsWith('share:')?1:1);
      $('#band').innerHTML=lineChart([{name:'high (90%)',color:'#9aa',points:pts(bd.p90)},{name:'middle',color:SCOL[0],points:pts(bd.p50)},{name:'low (10%)',color:'#9aa',points:pts(bd.p10)}],{ymin:0,ymax:k.startsWith('share:')?1:mx,xmax:n,ylab:k,fmt:v=>k.startsWith('share:')?Math.round(v*100)+'%':Math.round(v)})};
    if($('#bk')){$('#bk').onchange=drawBand;drawBand()}}}

async function comparePage(ids){const ps=(await api('projects')).filter(p=>p.run.started);const sel=new Set(ids?ids.split(','):ps.slice(0,2).map(p=>p.id));
  $('#view').innerHTML=`<a href="#/" class="muted small" style="text-decoration:none">← Home</a><h1 style="margin-top:4px">Compare studies</h1><p class="muted">Pick two or more runs, for example a study and its fork with a different offer.</p>
    <div class="chips">${ps.map(p=>`<span class="chip ${sel.has(p.id)?'on':''}" data-id="${p.id}">${esc(p.title)}</span>`).join('')}</div><div id="cmp"></div>`;
  document.querySelectorAll('.chip[data-id]').forEach(c=>c.onclick=()=>{sel.has(c.dataset.id)?sel.delete(c.dataset.id):sel.add(c.dataset.id);location.hash='#/compare/'+[...sel].join(',')});
  if(sel.size<2){$('#cmp').innerHTML='<p class="muted">Choose at least two.</p>';return}
  const c=await api('compare?ids='+[...sel].join(','));const cols=c.columns.filter(x=>x.run);
  const row=(lab,f)=>`<tr><td>${lab}</td>${cols.map(x=>`<td class="n">${f(x)}</td>`).join('')}</tr>`;
  $('#cmp').innerHTML=`<div class="card" style="overflow:auto"><table><thead><tr><th></th>${cols.map(x=>`<th><a href="#/p/${x.id}/report">${esc(x.title)}</a></th>`).join('')}</tr></thead><tbody>
    ${row('Rounds',x=>x.rounds)}
    ${c.actions.map(n=>row(`<b>${esc(n.replace(/_/g,' '))}</b>`,x=>{const a=x.actions[n];return a?`${a.count.toLocaleString()} <span class="muted small">(${(a.rate*100).toFixed(1)}%)</span>${a.blocked?' <span class="pill bad">blocked</span>':''}`:'—'})).join('')}
    ${row('Average opinion at end',x=>(x.opinion_end>=0?'+':'')+(x.opinion_end??0).toFixed(2))}
    ${row('In favour at end',x=>((x.for_end||0)*100).toFixed(1)+'%')}
    ${row('Against at end',x=>((x.against_end||0)*100).toFixed(1)+'%')}
    ${c.segments.map(g=>row(`<span class="muted">${esc(g.replace(/_/g,' '))}</span>`,x=>x.segments[g]!==undefined?stance(x.segments[g])+' '+x.segments[g].toFixed(2):'—')).join('')}
    ${c.decisions.map(d=>row(esc(d.replace(/_/g,' ')),x=>x.decisions[d]===undefined?'—':x.decisions[d]?'<span class="pill ok">approved</span>':'<span class="pill bad">rejected</span>')).join('')}
    ${row('Posts',x=>x.posts.toLocaleString())}</tbody></table></div>`}

/* ------------------------------------------------------------ boot */
(async()=>{INFO=await api('info');const h=INFO.hardware;$('#hw').textContent=`${h.tier} machine · ${h.ram_gb} GB · ${h.model}`;route()})();
</script>
</body>
</html>
