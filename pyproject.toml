[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agora-sim"
version = "0.3.0"
description = "Open-source, fully local living-world simulation and decision-intelligence platform"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pyyaml>=6.0",
    "networkx>=3.4",
    "pypdf>=4.0",
    "psutil>=5.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "jsonschema>=4.18"]

[project.scripts]
agora = "agora.cli:main"

[tool.setuptools.packages.find]
include = ["agora*"]

[tool.setuptools.package-data]
"agora.web" = ["static/*"]
"agora.examples" = ["*/*.yaml"]
"agora.pilot_fixtures" = ["*/*.csv", "*/*.json"]
"agora.ontology" = ["schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["protected_defaults: keep production policy/anchor defaults (no test relaxation)", "legacy_approve_disabled: keep legacy approve() disabled (production default)"]
