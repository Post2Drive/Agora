name: tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    # Windows jobs have taken about 9 to 10 minutes since PR #311 (about 18 to 25 before it);
    # one earlier job ran about 55 minutes and left no log.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      # SQLite-heavy tests were about 4x slower with temporary files on the Windows runner's
      # default drive than on its work drive (PR #311). No test or durability setting differs.
      - name: Put test temporary files on the work drive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
      - run: python -c "import tempfile; print(tempfile.gettempdir())"
      - run: python -m pytest -q -p no:cacheprovider --durations=25
